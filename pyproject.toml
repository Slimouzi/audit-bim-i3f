[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-bim-i3f"
version = "0.10.0"
description = "MCP server for BIM model audit against the I3F French BIM specifications (CCH BIM I3F V3.6)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Stanislas Limouzi", email = "stanislas@bimdata.io" },
]
keywords = [
    "bim",
    "ifc",
    "mcp",
    "model-context-protocol",
    "audit",
    "bimdata",
    "i3f",
    "construction",
    "amo",
    "loi-mop",
    "iso-19650",
    "uniformat",
    "bcf",
    "smart-views",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: French",
]
dependencies = [
    # Bornes hautes : protection contre les mises à jour majeures qui
    # ont déjà cassé des projets en aval. Dependabot proposera les bumps
    # via PR ; les tests CI valident chaque update.
    "requests>=2.31,<3",
    "openpyxl>=3.1,<4",
    "xlsxwriter>=3.2,<4",
    # pypdf >=6.9.1 : couvre 22 CVE recensées en 2025-2026 sur les
    # versions 5.x (cf. job CI security-audit). Usage limité à
    # ``PdfReader`` qui est stable depuis longtemps.
    "pypdf>=6.9.1,<7",
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
    "pydantic>=2.6,<3",
    "matplotlib>=3.8,<4",
    "python-dotenv>=1.0,<2",
    "fastmcp>=3.0,<4",
    "rapidfuzz>=3.6,<4",
    # Contrats communs (Finding, BimObject, filtres, WritePlan, ModelSnapshot)
    # et sandbox de chemins I/O (``bim_core.paths``, ex-``bim-sandbox``).
    # Bibliothèques first-party versionnées — sources résolues via
    # [tool.uv.sources] ci-dessous (tags Git). Voir dépôts Slimouzi/bim-core et
    # Slimouzi/bimdata-read.
    "bim-core>=0.3.0,<0.4",
    "bimdata-read>=0.1.7,<0.2",
    "bimdata-write>=0.1.5,<0.2",
    "bim-query>=0.1.5,<0.2",
    "bim-publication>=0.1.5,<0.2",
    # Cœur générique du moteur d'audit (Rule/run_audit/AuditResult). Consommé
    # par la façade audit_bim.audit.engine (PR shims ultérieure ; cette PR est
    # infra-only). v0.1.1 = summary() JSON-safe + py.typed + contrat de
    # déterminisme corrigé.
    "bim-audit-engine>=0.1.5,<0.2",
    # Socle générique de rendu des livrables (primitives Word/Excel, graphiques,
    # export PDF, charte BIMData). Ne contient AUCUN vocabulaire client : les
    # sections de rapport, le narratif CCH et les packs AVP restent ici.
    "bim-reporting>=0.2.0,<0.3",
    # Moteur d'exécution MCP partagé : sessions, résultats d'outil, erreurs
    # typées, registre. Aucun outil concret — les tools restent ici.
    "bim-mcp-runtime>=0.1.2,<0.2",
]

[project.optional-dependencies]
# Calcul géométrique local (IfcOpenShell) : permet à ``generate_avp_i3f_pack``
# de produire lui-même les contrats ``computed_base_quantities/v1`` et
# ``envelope_quantities/v1`` au lieu d'exiger qu'on les lui fournisse. Optionnel
# car ifcopenshell est lourd et tous les déploiements n'en ont pas besoin ; son
# absence donne un message explicite, jamais un livrable incomplet.
geometry = [
    "ifc-geometry-mcp>=0.5.1,<0.6",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.0",
    "reportlab>=4.0",  # génération de PDF de test
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "reportlab>=4.0",
    # Lecture de pyproject.toml / uv.lock par le garde-fou de versions
    # (``tomllib`` n'existe qu'à partir de Python 3.11).
    "tomli>=2.0; python_version < '3.11'",
]
ocr = [
    "pytesseract>=0.3",
    "pdf2image>=1.16",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/Slimouzi/audit-bim-mcp"
Repository = "https://github.com/Slimouzi/audit-bim-mcp"
Issues = "https://github.com/Slimouzi/audit-bim-mcp/issues"
Changelog = "https://github.com/Slimouzi/audit-bim-mcp/blob/master/CHANGELOG.md"

[project.scripts]
audit-bim = "audit_bim.cli:main"
audit-bim-mcp = "audit_bim.mcp.__main__:main"

[tool.uv.sources]
# ``bim-core`` n'est pas publié sur PyPI : uv le résout depuis le dépôt Git
# au tag figé. Bumper ce tag = bumper le contrat (et la borne de version
# dans [project.dependencies]), puis regénérer uv.lock (``uv lock``).
bim-core = { git = "https://github.com/Slimouzi/bim-core.git", tag = "bim-core-v0.3.0" }
bimdata-read = { git = "https://github.com/Slimouzi/bimdata-read.git", tag = "bimdata-read-v0.1.7" }
bimdata-write = { git = "https://github.com/Slimouzi/bimdata-write.git", tag = "bimdata-write-v0.1.5" }
bim-query = { git = "https://github.com/Slimouzi/bim-query.git", tag = "bim-query-v0.1.5" }
bim-publication = { git = "https://github.com/Slimouzi/bim-publication.git", tag = "bim-publication-v0.1.5" }
bim-audit-engine = { git = "https://github.com/Slimouzi/bim-audit-engine.git", tag = "bim-audit-engine-v0.1.5" }
bim-reporting = { git = "https://github.com/Slimouzi/bim-reporting.git", tag = "bim-reporting-v0.2.0" }
bim-mcp-runtime = { git = "https://github.com/Slimouzi/bim-mcp-runtime.git", tag = "bim-mcp-runtime-v0.1.2" }
ifc-geometry-mcp = { git = "https://github.com/Slimouzi/ifc-geometry-mcp.git", tag = "ifc-geometry-mcp-v0.5.1" }

[tool.setuptools.packages.find]
include = ["audit_bim*"]
exclude = ["tests*", "examples*", "docs*", "out*"]

[tool.setuptools.package-data]
"audit_bim" = ["py.typed", "reporting/BRAND_GUIDELINES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests d'intégration (démarrent un vrai serveur)",
    "slow: tests qui prennent plus d'1 seconde",
]

[tool.coverage.run]
source = ["audit_bim"]
omit = [
    "audit_bim/mcp/__main__.py",
    "audit_bim/cli.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["out", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (gérée par formatter)
    "B008",  # function calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts OK in tests
"examples/*" = ["F401", "E402"]  # imports/exemples démo

