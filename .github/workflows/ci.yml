name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check audit_bim tests scripts
      - name: Ruff format check
        run: ruff format --check audit_bim tests scripts
      - name: Guard — no raw BIMData _post in audit_bim
        # Les écritures BIMData doivent passer par les méthodes nommées de
        # bimdata-write (create_classification, assign_classification_elements,
        # write_element_propertyset, create_bcf_full_topic) — jamais ._post brut.
        run: |
          if grep -rnE "\._post\(|def _post" audit_bim --include='*.py'; then
            echo "::error::raw BIMData _post found in audit_bim — use a bimdata-write named method"
            exit 1
          fi
          echo "OK: no raw _post in audit_bim"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install bim-core (tagged contract lib)
        # bim-core n'est pas sur PyPI : on l'installe explicitement depuis le
        # tag Git AVANT audit-bim-i3f. La dépendance `bim-core>=0.1.0,<0.2` est
        # alors déjà satisfaite lors de l'install du package.
        run: pip install "git+https://github.com/Slimouzi/bim-core.git@bim-core-v0.1.2"
      - name: Install bimdata-read (tagged read core)
        run: pip install "git+https://github.com/Slimouzi/bimdata-read.git@bimdata-read-v0.1.5"
      - name: Install bimdata-write (tagged write core)
        run: pip install "git+https://github.com/Slimouzi/bimdata-write.git@bimdata-write-v0.1.3"
      - name: Install bim-sandbox (tagged shared sandbox)
        run: pip install "git+https://github.com/Slimouzi/bim-sandbox.git@bim-sandbox-v0.1.0"
      - name: Install bim-query (tagged read-only query layer)
        run: pip install "git+https://github.com/Slimouzi/bim-query.git@bim-query-v0.1.2"
      - name: Install bim-publication (tagged BCF/SmartViews builders)
        run: pip install "git+https://github.com/Slimouzi/bim-publication.git@bim-publication-v0.1.2"
      - name: Install bim-audit-engine (tagged generic audit engine core)
        run: pip install "git+https://github.com/Slimouzi/bim-audit-engine.git@bim-audit-engine-v0.1.3"
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run pytest with coverage
        run: |
          pytest --cov=audit_bim --cov-report=xml --cov-report=term tests/unit
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  ocr:
    # E14 (audit profond 2ᵉ passe) — les tests OCR étaient TOUJOURS skippés en CI
    # (binaire tesseract + extra [ocr] absents) : fausse confiance. Ce job installe
    # le binaire et l'extra pour les exécuter réellement.
    name: OCR tests (tesseract)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tesseract + poppler (binaires OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra poppler-utils
          tesseract --version
      - name: Install first-party tagged libs
        run: |
          pip install "git+https://github.com/Slimouzi/bim-core.git@bim-core-v0.1.2"
          pip install "git+https://github.com/Slimouzi/bimdata-read.git@bimdata-read-v0.1.5"
          pip install "git+https://github.com/Slimouzi/bimdata-write.git@bimdata-write-v0.1.3"
          pip install "git+https://github.com/Slimouzi/bim-sandbox.git@bim-sandbox-v0.1.0"
          pip install "git+https://github.com/Slimouzi/bim-query.git@bim-query-v0.1.2"
          pip install "git+https://github.com/Slimouzi/bim-publication.git@bim-publication-v0.1.2"
          pip install "git+https://github.com/Slimouzi/bim-audit-engine.git@bim-audit-engine-v0.1.3"
      - name: Install package + OCR + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,ocr]"
      - name: Run OCR tests (doivent s'EXÉCUTER, pas skipper)
        run: |
          set -o pipefail
          pytest tests/unit/test_ocr_robustness.py tests/unit/test_doe_ocr.py -rs | tee ocr_out.txt
          # Garde anti-fausse-confiance : au moins un test OCR doit avoir réellement
          # PASSÉ (si tesseract/ocr manquaient, tout serait skippé → aucun "passed").
          grep -qE "[0-9]+ passed" ocr_out.txt || {
            echo "::error::aucun test OCR exécuté — tesseract/ocr mal installés"
            exit 1
          }

  security-audit:
    name: Security audit (pip-audit) — uv.lock
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install uv pip-audit
      - name: Verify lockfile is up-to-date
        # Garantit que ``uv.lock`` est cohérent avec ``pyproject.toml``.
        # Si quelqu'un a bumpé une dep sans regen le lock, la CI casse
        # ici — ce qui force le contributeur à regen + commit le lock.
        run: uv lock --check
      - name: Export resolved dependencies from lockfile
        # ``--no-emit-project`` exclut audit-bim-i3f lui-même (pas
        # publié sur PyPI). ``--no-hashes`` car pip-audit n'utilise
        # pas les hashes — seuls les ``name==version`` comptent ici.
        # ``--no-emit-package bim-core`` : contrat first-party résolu via Git
        # (pas de version PyPI à scanner ; ses propres deps sont déjà couvertes).
        run: uv export --format requirements-txt --no-hashes --no-emit-project --no-emit-package bim-core --no-emit-package bimdata-read --no-emit-package bimdata-write --no-emit-package bim-sandbox --no-emit-package bim-query --no-emit-package bim-publication --no-emit-package bim-audit-engine --output-file requirements-from-lock.txt
      - name: Scan locked dependencies for CVEs
        # Audit **reproductible** : exactement les versions du lockfile,
        # pas ce que pip aurait résolu fraîchement. Permet aux résultats
        # de pip-audit d'être stables tant que le lock ne change pas.
        run: pip-audit -r requirements-from-lock.txt --format columns

  security-audit-ocr:
    name: Security audit (pip-audit) — extras [ocr]
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install uv pip-audit
      - name: Verify lockfile is up-to-date
        run: uv lock --check
      - name: Export resolved dependencies (including OCR extras)
        # ``--extra ocr`` ajoute pytesseract / pdf2image / Pillow au
        # lockfile résolu — ces deps ne sont pas dans le ``test`` extra
        # mais sont exécutées en runtime sur DOE PDF scanné.
        run: uv export --format requirements-txt --no-hashes --no-emit-project --no-emit-package bim-core --no-emit-package bimdata-read --no-emit-package bimdata-write --no-emit-package bim-sandbox --no-emit-package bim-query --no-emit-package bim-publication --no-emit-package bim-audit-engine --extra ocr --output-file requirements-from-lock-ocr.txt
      - name: Scan OCR extras for CVEs
        run: pip-audit -r requirements-from-lock-ocr.txt --format columns

  integration:
    name: Integration tests (HTTP transport)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bim-core (tagged contract lib)
        run: pip install "git+https://github.com/Slimouzi/bim-core.git@bim-core-v0.1.2"
      - name: Install bimdata-read (tagged read core)
        run: pip install "git+https://github.com/Slimouzi/bimdata-read.git@bimdata-read-v0.1.5"
      - name: Install bimdata-write (tagged write core)
        run: pip install "git+https://github.com/Slimouzi/bimdata-write.git@bimdata-write-v0.1.3"
      - name: Install bim-sandbox (tagged shared sandbox)
        run: pip install "git+https://github.com/Slimouzi/bim-sandbox.git@bim-sandbox-v0.1.0"
      - name: Install bim-query (tagged read-only query layer)
        run: pip install "git+https://github.com/Slimouzi/bim-query.git@bim-query-v0.1.2"
      - name: Install bim-publication (tagged BCF/SmartViews builders)
        run: pip install "git+https://github.com/Slimouzi/bim-publication.git@bim-publication-v0.1.2"
      - name: Install bim-audit-engine (tagged generic audit engine core)
        run: pip install "git+https://github.com/Slimouzi/bim-audit-engine.git@bim-audit-engine-v0.1.3"
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run integration tests
        # Couvre : transport streamable-http opérationnel, X-API-Key
        # (missing/wrong/valid), isolation de session entre clients.
        # Le runner GitHub autorise bind(127.0.0.1) contrairement au
        # sandbox local.
        run: pytest tests/integration -q

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint, test, integration, security-audit, security-audit-ocr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install build twine
      - name: Build
        run: python -m build --sdist --wheel
      - name: Check artifacts with twine
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
