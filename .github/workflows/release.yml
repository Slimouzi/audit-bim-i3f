name: Release

on:
  push:
    # Le préfixe est celui de la DISTRIBUTION (`audit-bim-mcp`), pas du dépôt :
    # `v*` ne matchait aucun tag réel depuis v0.8.0, et le workflow ne se
    # déclenchait donc plus — sans jamais échouer, puisqu'il ne partait pas.
    tags:
      - "audit-bim-mcp-v*"
  # Dry-run contrôlé. Ce workflow n'a plus tourné depuis v0.8.0 : le prochain
  # tag aurait été sa première exécution réelle depuis des semaines, découverte
  # un jour de release. Le déclenchement manuel permet de l'éprouver d'abord.
  # Il ne peut rien publier : ``create-release`` est conditionné à une ref de
  # tag, et un dispatch sur branche a ``github.ref = refs/heads/…``.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Gates de sécurité / qualité — DOIVENT passer avant attachement
  # des artefacts à la GitHub Release. On duplique les jobs critiques
  # de ci.yml plutôt que d'utiliser ``workflow_run`` (qui se base sur
  # le commit ET pas le tag — moins fiable pour garantir que le commit
  # taggé a bien été validé).
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check audit_bim tests scripts
      - run: ruff format --check audit_bim tests scripts

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Les tags, et tout l'historique. `test_release_trigger.py` confronte
          # le déclencheur aux tags RÉELLEMENT posés : sans eux, ces contrôles
          # se contentent de `skip`, et la CI est verte parce qu'ils ne
          # s'exécutent pas. Un checkout par défaut est superficiel et sans tags.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install bim-core (tagged contract lib)
        run: pip install "git+https://github.com/Slimouzi/bim-core.git@bim-core-v0.4.0"
      - name: Install bimdata-read (tagged read core)
        run: pip install "git+https://github.com/Slimouzi/bimdata-read.git@bimdata-read-v0.1.10"
      - name: Install bimdata-write (tagged write core)
        run: pip install "git+https://github.com/Slimouzi/bimdata-write.git@bimdata-write-v0.1.6"
      - name: Install bim-query (tagged read-only query layer)
        run: pip install "git+https://github.com/Slimouzi/bim-query.git@bim-query-v0.1.7"
      - name: Install bim-publication (tagged BCF/SmartViews builders)
        run: pip install "git+https://github.com/Slimouzi/bim-publication.git@bim-publication-v0.1.7"
      - name: Install bim-audit-engine (tagged generic audit engine core)
        run: pip install "git+https://github.com/Slimouzi/bim-audit-engine.git@bim-audit-engine-v0.1.6"
      - name: Install bim-reporting (tagged generic deliverable rendering core)
        run: pip install "git+https://github.com/Slimouzi/bim-reporting.git@bim-reporting-v0.2.0"
      - name: Install bim-mcp-runtime (tagged MCP execution core)
        run: pip install "git+https://github.com/Slimouzi/bim-mcp-runtime.git@bim-mcp-runtime-v0.1.2"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - run: pytest tests/unit -q

  integration:
    name: Integration tests (HTTP transport)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bim-core (tagged contract lib)
        run: pip install "git+https://github.com/Slimouzi/bim-core.git@bim-core-v0.4.0"
      - name: Install bimdata-read (tagged read core)
        run: pip install "git+https://github.com/Slimouzi/bimdata-read.git@bimdata-read-v0.1.10"
      - name: Install bimdata-write (tagged write core)
        run: pip install "git+https://github.com/Slimouzi/bimdata-write.git@bimdata-write-v0.1.6"
      - name: Install bim-query (tagged read-only query layer)
        run: pip install "git+https://github.com/Slimouzi/bim-query.git@bim-query-v0.1.7"
      - name: Install bim-publication (tagged BCF/SmartViews builders)
        run: pip install "git+https://github.com/Slimouzi/bim-publication.git@bim-publication-v0.1.7"
      - name: Install bim-audit-engine (tagged generic audit engine core)
        run: pip install "git+https://github.com/Slimouzi/bim-audit-engine.git@bim-audit-engine-v0.1.6"
      - name: Install bim-reporting (tagged generic deliverable rendering core)
        run: pip install "git+https://github.com/Slimouzi/bim-reporting.git@bim-reporting-v0.2.0"
      - name: Install bim-mcp-runtime (tagged MCP execution core)
        run: pip install "git+https://github.com/Slimouzi/bim-mcp-runtime.git@bim-mcp-runtime-v0.1.2"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - run: pytest tests/integration -q

  security-audit:
    name: Security audit (pip-audit) — uv.lock
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install uv pip-audit
      - run: uv lock --check
      - run: uv export --format requirements-txt --no-hashes --no-emit-project --no-emit-package bim-core --no-emit-package bimdata-read --no-emit-package bimdata-write --no-emit-package bim-query --no-emit-package bim-publication --no-emit-package bim-audit-engine --no-emit-package bim-reporting --no-emit-package bim-mcp-runtime --output-file requirements-from-lock.txt
      - run: pip-audit -r requirements-from-lock.txt --format columns

  security-audit-ocr:
    name: Security audit (pip-audit) — extras [ocr]
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install uv pip-audit
      - run: uv lock --check
      - run: uv export --format requirements-txt --no-hashes --no-emit-project --no-emit-package bim-core --no-emit-package bimdata-read --no-emit-package bimdata-write --no-emit-package bim-query --no-emit-package bim-publication --no-emit-package bim-audit-engine --no-emit-package bim-reporting --no-emit-package bim-mcp-runtime --extra ocr --output-file requirements-from-lock-ocr.txt
      - run: pip-audit -r requirements-from-lock-ocr.txt --format columns

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    # Gates obligatoires avant la moindre construction d'artifact :
    # une release qui ne passe pas la CI n'a aucune raison d'être
    # publiée comme GitHub Release.
    needs: [lint, test, integration, security-audit, security-audit-ocr]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install build twine
      - name: Build
        run: python -m build --sdist --wheel
      - name: Check artifacts
        run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke-install:
    name: Smoke install wheel (clean venv)
    # Le wheel n'est pas seulement construit + vérifié (twine) : on l'INSTALLE
    # dans un venv vierge, on vérifie la cohérence des dépendances (pip check),
    # et on exécute un smoke test (import + CLI). Une release dont le wheel ne
    # s'installe/importe pas ne doit pas être publiée.
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Clean venv + preinstall tagged deps + install wheel
        run: |
          python -m venv /tmp/smoke
          . /tmp/smoke/bin/activate
          python -m pip install --upgrade pip
          # Les 7 packages first-party (non PyPI) depuis leurs tags Git AVANT le wheel.
          pip install "git+https://github.com/Slimouzi/bim-core.git@bim-core-v0.4.0"
          pip install "git+https://github.com/Slimouzi/bimdata-read.git@bimdata-read-v0.1.10"
          pip install "git+https://github.com/Slimouzi/bimdata-write.git@bimdata-write-v0.1.6"
          pip install "git+https://github.com/Slimouzi/bim-query.git@bim-query-v0.1.7"
          pip install "git+https://github.com/Slimouzi/bim-publication.git@bim-publication-v0.1.7"
          pip install "git+https://github.com/Slimouzi/bim-audit-engine.git@bim-audit-engine-v0.1.6"
          pip install "git+https://github.com/Slimouzi/bim-reporting.git@bim-reporting-v0.2.0"
          pip install "git+https://github.com/Slimouzi/bim-mcp-runtime.git@bim-mcp-runtime-v0.1.2"
          # Le WHEEL construit (pas -e, pas l'arbre source).
          pip install dist/*.whl
      - name: pip check (dependency consistency)
        run: |
          . /tmp/smoke/bin/activate
          pip check
      - name: Import + CLI smoke test
        run: |
          . /tmp/smoke/bin/activate
          python -c "import audit_bim; print('import audit_bim OK')"
          audit-bim --help

  create-release:
    name: Create GitHub Release
    needs: [smoke-install]
    runs-on: ubuntu-latest
    # Publier n'a de sens que sur un **push de tag de release**.
    #
    # Tester la seule ref ne suffit pas : ``workflow_dispatch`` accepte une ref
    # de tag (``gh workflow run --ref audit-bim-mcp-v0.11.0``), qui satisferait
    # un ``startsWith(github.ref, 'refs/tags/')`` et publierait — alors même
    # que le dispatch est censé être le chemin qui ne publie pas. D'où le test
    # de l'ÉVÉNEMENT, et pas seulement de la ref.
    #
    # Le préfixe est complet (``refs/tags/audit-bim-mcp-v``) : un tag nu
    # ``v0.10.0``, qui ne déclenche déjà pas le workflow, ne doit pas non plus
    # ouvrir cette porte s'il y arrivait autrement.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/audit-bim-mcp-v')
    # Distribution via GitHub Releases uniquement (le projet n'est pas
    # publié sur PyPI). Les artefacts sdist + wheel produits par
    # ``build`` sont attachés à la release GitHub. L'installation
    # nécessite de préinstaller ``bim-core`` (contrat commun, non publié
    # sur PyPI) — voir la note ``body`` ci-dessous, injectée dans la
    # release pour que la promesse d'installation reste vraie.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            `bim-core` (contrats + sandbox de chemins), `bimdata-read`
            (lecture), `bimdata-write` (écriture), `bim-query` (couche requête
            read-only), `bim-publication` (builders BCF/Smart Views) et
            `bim-audit-engine` (cœur générique du moteur d'audit),
            `bim-reporting` (socle de rendu des livrables) et
            `bim-mcp-runtime` (moteur d'exécution MCP) ne sont pas
            publiés sur PyPI. Préinstallez-les depuis leurs tags Git **avant** le
            wheel/sdist :

            ```bash
            pip install "git+https://github.com/Slimouzi/bim-core.git@bim-core-v0.4.0"
            pip install "git+https://github.com/Slimouzi/bimdata-read.git@bimdata-read-v0.1.10"
            pip install "git+https://github.com/Slimouzi/bimdata-write.git@bimdata-write-v0.1.6"
            pip install "git+https://github.com/Slimouzi/bim-query.git@bim-query-v0.1.7"
            pip install "git+https://github.com/Slimouzi/bim-publication.git@bim-publication-v0.1.7"
            pip install "git+https://github.com/Slimouzi/bim-audit-engine.git@bim-audit-engine-v0.1.6"
            pip install "git+https://github.com/Slimouzi/bim-reporting.git@bim-reporting-v0.2.0"
            pip install "git+https://github.com/Slimouzi/bim-mcp-runtime.git@bim-mcp-runtime-v0.1.2"
            pip install <url-de-l-asset-wheel-ci-dessous>
            ```
          files: dist/*
